<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanSwift — My Jobs</title>
<style>
:root{--blue:#0078C8;--green:#00643C;--cyan:#7DDBD8;--bg:#F4FAFE;--dark:#1A2E2A;--red:#e74c3c;--orange:#e67e22;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:var(--bg);color:var(--dark);min-height:100vh;}
.header{background:linear-gradient(135deg,var(--green),var(--blue));color:#fff;padding:14px 20px;text-align:center;}
.logo{font-size:1.3rem;font-weight:800;}.logo span{color:var(--cyan);}
.subtitle{font-size:0.78rem;opacity:0.8;margin-top:2px;}
.container{padding:16px;max-width:600px;margin:0 auto;}

.job-card{background:#fff;border-radius:16px;box-shadow:0 3px 12px rgba(0,0,0,0.08);margin-bottom:16px;overflow:hidden;}
.job-header-bar{padding:14px 16px;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;}
.job-service{font-size:1rem;font-weight:700;}.job-date{font-size:0.78rem;opacity:0.85;margin-top:2px;}
.job-body{padding:14px 16px;}
.info-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:0.84rem;}
.info-row:last-child{border-bottom:none;}
.info-icon{font-size:1rem;flex-shrink:0;width:22px;}
.info-val{flex:1;line-height:1.4;}
.info-label{font-size:0.7rem;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}

.checklist-section{padding:14px 16px;border-top:2px solid #f0f0f0;}
.checklist-title{font-size:0.88rem;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.progress-bar{background:#eee;border-radius:6px;height:8px;margin-bottom:12px;}
.progress-fill{background:var(--green);height:8px;border-radius:6px;transition:width 0.4s;}
.check-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f9f9f9;cursor:pointer;transition:background 0.15s;border-radius:6px;padding-left:4px;}
.check-item:hover{background:#f8f9fa;}
.check-item.done{opacity:0.6;}
.check-box{width:22px;height:22px;border-radius:6px;border:2px solid #ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.8rem;transition:all 0.2s;}
.check-item.done .check-box{background:var(--green);border-color:var(--green);color:#fff;}
.check-text{font-size:0.83rem;flex:1;}
.check-item.done .check-text{text-decoration:line-through;color:#aaa;}

.btn-done{width:100%;padding:15px;border:none;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:14px;transition:all 0.2s;}
.btn-done.enabled{background:var(--green);color:#fff;box-shadow:0 4px 15px rgba(0,100,60,0.3);}
.btn-done.disabled{background:#e0e0e0;color:#aaa;cursor:not-allowed;}

.qr-section{background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,0.08);margin-top:16px;}
.qr-title{font-size:0.9rem;font-weight:700;margin-bottom:10px;color:var(--dark);}
.qr-code{width:150px;height:150px;margin:0 auto 10px;background:#f5f5f5;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.qr-text{font-size:0.78rem;color:#888;}
.qr-link{color:var(--blue);font-weight:600;font-size:0.82rem;margin-top:6px;display:block;}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:0.72rem;font-weight:700;}
.badge-pending{background:#fff3e0;color:var(--orange);}
.badge-done{background:#e8f5e9;color:var(--green);}
.badge-paid{background:#f5f5f5;color:#888;}

.empty{text-align:center;padding:50px 20px;color:#aaa;}
.empty-icon{font-size:3rem;margin-bottom:10px;}

.notif{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 20px;border-radius:11px;font-size:0.85rem;font-weight:600;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.2);animation:slideDown 0.3s ease;white-space:nowrap;}
@keyframes slideDown{from{transform:translateX(-50%) translateY(-20px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}

.completed-banner{background:linear-gradient(135deg,var(--green),#00843C);color:#fff;border-radius:12px;padding:14px;text-align:center;margin-top:12px;}
.completed-banner h3{font-size:1rem;margin-bottom:4px;}
.completed-banner p{font-size:0.8rem;opacity:0.9;}
</style>
</head>
<body>
<div class="header">
  <div class="logo">Clean<span>Swift</span></div>
  <div class="subtitle" id="emp-greeting">My Jobs Today</div>
</div>

<div class="container" id="main-content">
  <div class="empty"><div class="empty-icon">⏳</div><p>Loading your jobs...</p></div>
</div>

<script>
const GOOGLE_REVIEW='https://g.page/r/CYme-2qu1O2QEBM/review';

function getParam(name){return new URLSearchParams(location.search).get(name);}
function fmtDate(d){if(!d)return'';const dt=new Date(d+'T12:00');return dt.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'});}
function notify(msg,color){
  const n=document.createElement('div');n.className='notif';
  n.style.background=color||'var(--green)';n.textContent=msg;
  document.body.appendChild(n);setTimeout(()=>n.remove(),3000);
}

const empId=getParam('id');
let jobs=JSON.parse(localStorage.getItem('cs_jobs')||'[]');
let emps=JSON.parse(localStorage.getItem('cs_emps')||'[]');

if(!empId){
  document.getElementById('main-content').innerHTML=`
    <div class="empty"><div class="empty-icon">🔐</div><p>Invalid link.<br>Please ask your manager for your personal link.</p></div>`;
} else {
  const emp=emps.find(e=>e.id===empId);
  if(emp) document.getElementById('emp-greeting').textContent='Hi '+emp.name+' 👋';

  const myJobs=jobs.filter(j=>{if(j.cleaners&&j.cleaners.length>0)return j.cleaners.some(c=>c.id===empId)&&j.status!=='paid';return j.empId===empId&&j.status!=='paid';});
  render(myJobs);
}

function save(){localStorage.setItem('cs_jobs',JSON.stringify(jobs));}

function render(myJobs){
  const el=document.getElementById('main-content');
  if(!myJobs.length){
    el.innerHTML=`
      <div class="empty">
        <div class="empty-icon">🎉</div>
        <p><b>No jobs assigned yet!</b><br>Check back later or ask your manager.</p>
      </div>
      ${qrSection()}
    `;
    return;
  }

  el.innerHTML=myJobs.map(job=>{
    const done=job.checklistDone||[];
    const tot=job.checklist?job.checklist.length:0;
    const pct=tot?Math.round(done.length/tot*100):0;
    const allDone=done.length>=tot&&tot>0;
    const isDone=job.status==='done';
    return `
      <div class="job-card" id="card-${job.id}">
        <div class="job-header-bar">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <div class="job-service">${job.service} — ${job.client}</div>
              <div class="job-date">📅 ${fmtDate(job.date)} at ${job.time||'TBD'}</div>
            </div>
            <div class="badge ${isDone?'badge-done':'badge-pending'}">${isDone?'✅ Done':'⏳ Pending'}</div>
          </div>
        </div>
        <div class="job-body">
          <div class="info-row">
            <div class="info-icon">📍</div>
            <div class="info-val"><div class="info-label">Address</div>${job.address}</div>
          </div>
          <div class="info-row">
            <div class="info-icon">🧹</div>
            <div class="info-val"><div class="info-label">Service</div>${job.service}${job.size?' · '+job.size:''}</div>
          </div>
          <div class="info-row">
            <div class="info-icon">⏰</div>
            <div class="info-val"><div class="info-label">Time</div>${job.time||'TBD'} — ${fmtDate(job.date)}</div>
          </div>
          ${job.notes?`<div class="info-row"><div class="info-icon">📝</div><div class="info-val"><div class="info-label">Notes from manager</div><b>${job.notes}</b></div></div>`:''}
          ${job.cleaners&&job.cleaners.length>1?`<div class="info-row"><div class="info-icon">👥</div><div class="info-val"><div class="info-label">Team on this job</div>${job.cleaners.map(c=>`${c.name}${c.id===empId?' (you)':''}`).join(', ')}</div></div>`:''}
          <div class="info-row">
            <div class="info-icon">📋</div>
            <div class="info-val"><div class="info-label">Progress</div>${done.length}/${tot} tasks completed (${pct}%)</div>
          </div>
        </div>

        ${!isDone?`
        <div class="checklist-section">
          <div class="checklist-title">
            <span>✅ Checklist</span>
            <span style="color:${pct===100?'var(--green)':'var(--orange)'};font-size:0.82rem;">${pct}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="prog-${job.id}" style="width:${pct}%"></div></div>
          <div id="list-${job.id}">
            ${(job.checklist||[]).map((task,i)=>`
              <div class="check-item ${done.includes(task)?'done':''}" onclick="toggleTask('${job.id}','${task.replace(/'/g,"\\'")}')">
                <div class="check-box">${done.includes(task)?'✓':''}</div>
                <div class="check-text">${task}</div>
              </div>
            `).join('')}
          </div>
          <button class="btn-done ${allDone?'enabled':'disabled'}" id="btn-${job.id}" onclick="completeJob('${job.id}')" ${allDone?'':'disabled'}>
            ${allDone?'🎉 Mark as Complete!':'⬜ Complete all tasks first ('+done.length+'/'+tot+')'}
          </button>
        </div>
        `:`
        <div class="completed-banner">
          <h3>🎉 Job Completed!</h3>
          <p>Great work! Your manager has been notified.</p>
        </div>
        `}
      </div>
    `;
  }).join('')+qrSection();
}

function qrSection(){
  return `
    <div class="qr-section">
      <div class="qr-title">⭐ Ask your client for a Google Review!</div>
      <div class="qr-code">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(GOOGLE_REVIEW)}" width="130" height="130" style="border-radius:8px;">
      </div>
      <div class="qr-text">Show this QR code to your client at the end of the job</div>
      <a href="${GOOGLE_REVIEW}" target="_blank" class="qr-link">Or click here to open the review link</a>
    </div>
  `;
}

function toggleTask(jobId, task){
  const j=jobs.find(j=>j.id===jobId);
  if(!j||j.status==='done')return;
  if(!j.checklistDone)j.checklistDone=[];
  const idx=j.checklistDone.indexOf(task);
  if(idx>-1)j.checklistDone.splice(idx,1);
  else j.checklistDone.push(task);
  save();

  const done=j.checklistDone;
  const tot=j.checklist.length;
  const pct=Math.round(done.length/tot*100);
  const allDone=done.length>=tot;

  // Update UI without full re-render
  document.getElementById('prog-'+jobId).style.width=pct+'%';
  const btn=document.getElementById('btn-'+jobId);
  if(btn){
    btn.className='btn-done '+(allDone?'enabled':'disabled');
    btn.disabled=!allDone;
    btn.textContent=allDone?'🎉 Mark as Complete!':'⬜ Complete all tasks first ('+done.length+'/'+tot+')';
  }
  // Update item style
  const items=document.querySelectorAll(`#list-${jobId} .check-item`);
  (j.checklist||[]).forEach((t,i)=>{
    const isDone=done.includes(t);
    items[i].className='check-item'+(isDone?' done':'');
    items[i].querySelector('.check-box').textContent=isDone?'✓':'';
    items[i].querySelector('.check-text').style.textDecoration=isDone?'line-through':'none';
  });
}

function completeJob(jobId){
  const j=jobs.find(j=>j.id===jobId);
  if(!j)return;
  const done=j.checklistDone||[];
  if(done.length<j.checklist.length){notify('Complete all tasks first!','var(--red)');return;}
  j.status='done';j.completedAt=new Date().toISOString();
  save();
  notify('✅ Job marked complete! Manager notified.');
  // Refresh
  setTimeout(()=>{
    jobs=JSON.parse(localStorage.getItem('cs_jobs')||'[]');
    const myJobs=jobs.filter(j=>{if(j.cleaners&&j.cleaners.length>0)return j.cleaners.some(c=>c.id===empId)&&j.status!=='paid';return j.empId===empId&&j.status!=='paid';});
    render(myJobs);
  },1000);
}

// Auto-refresh every 30s
setInterval(()=>{
  jobs=JSON.parse(localStorage.getItem('cs_jobs')||'[]');
  const myJobs=jobs.filter(j=>{if(j.cleaners&&j.cleaners.length>0)return j.cleaners.some(c=>c.id===empId)&&j.status!=='paid';return j.empId===empId&&j.status!=='paid';});
  render(myJobs);
},30000);
</script>
</body>
</html>
